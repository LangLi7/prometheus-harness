/*
 * Eigener Favicon — nicht aus der Vorlage übernommen, sondern neu: das ◇/◆-Zeichen
 * des Harness in der Akzentfarbe. Ohne ihn fragt der Browser /favicon.ico an und der
 * Dev-Server antwortet mit 404 (stand als Konsolenfehler im Protokoll).
 */
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0a0a0a" />
  <text
    x="16"
    y="23"
    text-anchor="middle"
    font-family="Consolas, monospace"
    font-size="20"
    fill="#ffb35c"
  >◆</text>
</svg>
