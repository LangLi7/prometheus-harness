    <!--
      **Die Marke im Browserreiter.**

      Datei entsteht aus dem Zeichensatz (`bun tools/write-favicon.mjs`), damit im Reiter **dieselbe**

    -->

  <body>
    <!--
      Prototyp der Prometheus-Oberfläche. Zwei Modi:

        1. CHAT   — Verlauf, Denk-Karte, Codeblock, Eingabe. Kein Canvas.
        2. OS     — die Welt: 3D-Universum mit Rotation, Tiefen-Zoom und
                    Bezugswechsel (Galaxie → Sternhaufen → Sonnensystem → Planet),
                    Koordinatensystem-Lineal, Objektsuche, Docking-Panels.

      Ein Feld, kein Rahmen: alles wird aus `src/` aufgebaut.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
