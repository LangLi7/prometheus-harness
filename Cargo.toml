[workspace]
resolver = "2"
members = [
    "native/landlock-run",
    "native/flock",
    "native/atomicfs",
    "native/pty",
    "native/index",
    "native/crypto",
    "native/pmh-tray",
    "services/pmh-sandbox",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "BSD-3-Clause"
repository = "https://github.com/LangLi7/prometheus-harness"
authors = ["Prometheus Harness"]

[workspace.dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
