[package]
name = "pmh-tray"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

description = "Tray launcher for the Prometheus Harness on Windows: start, stop, open, autostart — a process, not an addon"

[[bin]]
name = "pmh-tray"
path = "src/main.rs"

# The console-free twin. It exists as its own binary because the Windows subsystem
# is a property of the whole binary: one of the two must have no console (autostart)
# and the other must keep it (a human asking for `--status`).
[[bin]]
name = "pmh-tray-gui"
path = "src/gui_main.rs"

[lib]
name = "pmh_tray"
path = "src/lib.rs"

[dependencies]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
