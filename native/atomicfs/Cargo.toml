[package]
name = "pmh-atomicfs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

description = "Durable atomic writes: write-through flush, atomic replace, identity report — replaces the koffi native addon"

[[bin]]
name = "pmh-atomicfs"
path = "src/main.rs"

[lib]
name = "pmh_atomicfs"
path = "src/lib.rs"

[dependencies]
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }
